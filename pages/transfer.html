<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Aura Neo-Banking — realizar una transferencia.">
    <meta name="theme-color" content="#10131a">
    <title>AURA NEO-BANKING</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/transfer.css">
    <link rel="stylesheet" href="/css/bottom-nav.css">

</head>
<body>
    <div class="aurora" aria-hidden="true"></div>

    <div class="app">
        
        <header class="app-header" id="top">
            <div class="app-top">
                <a href="../index.html" class="app-brand">
                    <span class="logo-mark" aria-hidden="true"></span>
                    <span>AURA NEO-BANKING</span>
                </a>
            </div>

            <h1 class="screen-title">Transferir</h1>

            <div class="source-account">
                <p>Desde <strong>Cuenta</strong></p>
                <p class="source-balance">Disponible <span>24.120,90 €</span></p>
            </div>
        </header>

        <main class="app-main transfer">
            
            <section class="card step-card">
                <div class="step-head">
                    <span class="step-num">1</span>
                    <h2>Destinatario</h2>
                </div>

                <div class="recipient">
                    <span class="recipient-avatar" id="recipient-avatar" aria-hidden="true">?</span>
                    <div class="recipient-fields">
                        <input class="field-input" id="recipient-name" type="text"
                               placeholder="Nombre del destinatario" autocomplete="off" aria-label="Nombre del destinatario">
                        <span class="iban-field">
                            <input class="field-input" id="recipient-iban" type="text"
                                   placeholder="IBAN · ES00 0000 0000 0000 0000 0000"
                                   autocomplete="off" spellcheck="false" aria-label="IBAN del destinatario">
                            <span class="valid-badge" id="iban-badge" hidden>Válido</span>
                        </span>
                    </div>
                </div>
            </section>

            <section class="card step-card">
                <div class="step-head">
                    <span class="step-num">2</span>
                    <h2>Importe</h2>
                </div>

                <div class="amount-input">
                    <input class="amount-field" id="amount-field" type="text" inputmode="decimal"
                           value="250,00" aria-label="Importe a enviar" autocomplete="off">
                    <span class="currency" aria-hidden="true">€</span>
                </div>
                <p class="amount-note">Sin comisiones</p>

                <div class="quick-adds">
                    <button type="button" data-add="20">+20 €</button>
                    <button type="button" data-add="50">+50 €</button>
                    <button type="button" data-add="100">+100 €</button>
                </div>
            </section>

            <section class="card step-card">
                <div class="step-head">
                    <span class="step-num">3</span>
                    <h2>Concepto</h2>
                </div>
                <input class="concepto" id="concepto" type="text" maxlength="60"
                       placeholder="Añade un motivo" value="Cena fin de semana">
            </section>

            <section class="card step-card">
                <div class="step-head">
                    <span class="step-num">4</span>
                    <h2>Confirmación</h2>
                </div>
                <div class="total-row">
                    <span>Total a enviar</span>
                    <strong id="total">250,00 €</strong>
                </div>
            </section>

            <button class="btn-confirm" id="confirmar" type="button">
                Confirmar Transferencia
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M21.5 3.5 3 10.5l6.5 2.5M21.5 3.5l-3.6 15.4-5.4-4.4M21.5 3.5 9.5 13l1.4 5.3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
        </main>
    </div>

    <!-- ============ BARRA INFERIOR ============ -->
    <nav class="tabbar" aria-label="Navegación principal">
        <a href="../index.html" class="tabbar-item">
            <svg class="tabbar-icon" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3.5" y="3.5" width="7.2" height="7.2" rx="1.8" fill="none" stroke="currentColor" stroke-width="1.9"/>
                <rect x="13.3" y="3.5" width="7.2" height="7.2" rx="1.8" fill="none" stroke="currentColor" stroke-width="1.9"/>
                <rect x="3.5" y="13.3" width="7.2" height="7.2" rx="1.8" fill="none" stroke="currentColor" stroke-width="1.9"/>
                <rect x="13.3" y="13.3" width="7.2" height="7.2" rx="1.8" fill="none" stroke="currentColor" stroke-width="1.9"/>
            </svg>
            <span>Inicio</span>
        </a>
        <a href="transfer.html" class="tabbar-item is-active">
            <svg class="tabbar-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 8h13M14 5l3 3-3 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M20 16H7M10 13l-3 3 3 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>Transferir</span>
        </a>
        <a href="history.html" class="tabbar-item">
            <svg class="tabbar-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M6 3h9l4 4v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/>
                <path d="M14.5 3v4.5H19M8.5 12.5h7M8.5 16h4.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>Historial</span>
        </a>
    </nav>
    <script src="../js/views/transfer.js"></script>
</body>
</html>
